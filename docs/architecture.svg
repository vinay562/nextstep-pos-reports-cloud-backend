<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="760" viewBox="0 0 1570 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 10; }
      .lambda { fill: #FFF4E8; stroke: #ED7100; }
      .s3 { fill: #F3F8E8; stroke: #7AA116; }
      .ddb { fill: #FBEAFB; stroke: #C925D1; }
      .sqs { fill: #FDE8F2; stroke: #E7157B; }
      .api { fill: #F5F0FF; stroke: #8C4FFF; }
      .dlq { fill: #FEF2F2; stroke: #DC2626; stroke-dasharray: 5 3; }
      .client { fill: #F1F5F9; stroke: #64748B; }
      .kind { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
      .name { font-size: 15px; font-weight: 600; fill: #0F172A; }
      .note { font-size: 12px; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .read { stroke-dasharray: 6 4; }
      .fail { stroke: #DC2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
      .title { font-size: 20px; font-weight: 700; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1570" height="760" fill="#FFFFFF"/>
  <text x="20" y="38" class="title">NextStep POS report pipeline</text>

  <!-- Client -->
  <rect class="box client" x="15" y="455" width="100" height="70"/>
  <text x="65" y="486" text-anchor="middle" class="name">Client</text>
  <text x="65" y="506" text-anchor="middle" class="note">ground system</text>

  <!-- API Gateway -->
  <rect class="box api" x="170" y="280" width="170" height="420"/>
  <text x="185" y="304" class="kind" fill="#8C4FFF">API GATEWAY</text>
  <text x="185" y="324" class="name">HTTP API</text>
  <rect x="182" y="350" width="146" height="40" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="255" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">POST /pos-reports</text>
  <rect x="182" y="600" width="146" height="40" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="255" y="625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">GET /status/{flightId}</text>
  <path class="edge" d="M115,490 L170,490"/>
  <text x="122" y="480" class="note">HTTPS</text>

  <!-- Receive Lambda -->
  <rect class="box lambda" x="390" y="340" width="190" height="60"/>
  <text x="402" y="362" class="kind" fill="#ED7100">λ LAMBDA</text>
  <text x="402" y="384" class="name">ReceivePosReport</text>
  <path class="edge" d="M328,370 L390,370"/>
  <text x="402" y="420" class="note">validates, 400 if malformed</text>
  <text x="402" y="436" class="note">returns flightId + RECEIVED</text>

  <!-- Status Lambda -->
  <rect class="box lambda" x="390" y="590" width="190" height="60"/>
  <text x="402" y="612" class="kind" fill="#ED7100">λ LAMBDA</text>
  <text x="402" y="634" class="name">GetFlightStatus</text>
  <path class="edge" d="M328,620 L390,620"/>

  <!-- S3 bucket -->
  <rect class="box s3" x="640" y="110" width="230" height="340"/>
  <text x="655" y="134" class="kind" fill="#7AA116">S3</text>
  <text x="680" y="134" class="name">PosReportsBucket</text>
  <text x="655" y="440" class="note">notification filter: prefix pos/ only</text>
  <rect x="660" y="165" width="190" height="50" rx="6" fill="#FFFFFF" stroke="#7AA116"/>
  <text x="672" y="187" font-size="14" font-weight="700" fill="#0F172A">pos/</text>
  <text x="672" y="204" class="note">raw text · fires S3 event</text>
  <rect x="660" y="265" width="190" height="50" rx="6" fill="#FFFFFF" stroke="#7AA116"/>
  <text x="672" y="287" font-size="14" font-weight="700" fill="#0F172A">attachment/</text>
  <text x="672" y="304" class="note">parsed report JSON</text>
  <rect x="660" y="365" width="190" height="50" rx="6" fill="#FFFFFF" stroke="#7AA116"/>
  <text x="672" y="387" font-size="14" font-weight="700" fill="#0F172A">results/</text>
  <text x="672" y="404" class="note">calculation result JSON</text>
  <path class="edge" d="M580,370 L612,370 L612,190 L660,190"/>
  <text x="560" y="160" class="note">① put raw</text>

  <!-- Parse Lambda -->
  <rect class="box lambda" x="930" y="160" width="190" height="60"/>
  <text x="942" y="182" class="kind" fill="#ED7100">λ LAMBDA</text>
  <text x="942" y="204" class="name">ParsePosReport</text>
  <path class="edge" d="M850,190 L930,190"/>
  <text x="876" y="180" class="note">② event</text>
  <path class="edge" d="M960,220 L960,290 L850,290"/>
  <text x="868" y="282" class="note">③ put JSON</text>

  <!-- Parser DLQ -->
  <rect class="box dlq" x="930" y="60" width="190" height="50"/>
  <text x="942" y="80" class="kind" fill="#DC2626">SQS · DLQ</text>
  <text x="942" y="99" font-size="13" font-weight="600" fill="#0F172A">ParserDeadLetterQueue</text>
  <path class="edge fail" d="M1025,160 L1025,112"/>
  <text x="1032" y="140" class="note" fill="#DC2626">after 2 retries</text>

  <!-- Calculation queue -->
  <rect class="box sqs" x="1180" y="160" width="190" height="60"/>
  <text x="1192" y="182" class="kind" fill="#E7157B">SQS</text>
  <text x="1192" y="204" class="name">CalculationQueue</text>
  <path class="edge" d="M1120,190 L1180,190"/>
  <text x="1124" y="180" class="note">④ send</text>

  <!-- Calculation DLQ -->
  <rect class="box dlq" x="1420" y="160" width="135" height="60"/>
  <text x="1432" y="182" class="kind" fill="#DC2626">SQS · DLQ</text>
  <text x="1432" y="203" font-size="13" font-weight="600" fill="#0F172A">Calculation DLQ</text>
  <path class="edge fail" d="M1370,190 L1420,190"/>
  <text x="1374" y="240" class="note" fill="#DC2626">after 3 failed</text>
  <text x="1374" y="255" class="note" fill="#DC2626">receives</text>

  <!-- Calculate Lambda -->
  <rect class="box lambda" x="1180" y="370" width="190" height="60"/>
  <text x="1192" y="392" class="kind" fill="#ED7100">λ LAMBDA</text>
  <text x="1192" y="414" class="name">CalculateFlightStatus</text>
  <path class="edge" d="M1275,220 L1275,370"/>
  <text x="1283" y="300" class="note">⑤ trigger (batch,</text>
  <text x="1283" y="316" class="note">partial failures)</text>
  <path class="edge read" d="M850,300 L1200,370"/>
  <text x="1080" y="322" class="note">⑦ read JSON</text>
  <path class="edge" d="M1180,400 L850,400"/>
  <text x="880" y="418" class="note">⑧ put result</text>

  <!-- DynamoDB: parsed reports -->
  <rect class="box ddb" x="930" y="590" width="190" height="60"/>
  <text x="942" y="612" class="kind" fill="#C925D1">DYNAMODB</text>
  <text x="942" y="634" class="name">ParsedReportsTable</text>
  <path class="edge" d="M1060,220 L1060,590"/>
  <text x="1068" y="520" class="note">③ put</text>
  <path class="edge read" d="M1200,430 L1110,590"/>
  <text x="1172" y="520" class="note">⑥ get</text>

  <!-- DynamoDB: calculation results -->
  <rect class="box ddb" x="1180" y="590" width="190" height="60"/>
  <text x="1192" y="612" class="kind" fill="#C925D1">DYNAMODB</text>
  <text x="1192" y="634" class="name">CalculationResultsTable</text>
  <path class="edge" d="M1300,430 L1300,590"/>
  <text x="1308" y="520" class="note">⑨ put</text>

  <!-- Status reads -->
  <path class="edge read" d="M580,620 L930,620"/>
  <path class="edge read" d="M485,650 L485,690 L1275,690 L1275,650"/>
  <text x="600" y="610" class="note">query latest by flightId</text>
  <text x="600" y="682" class="note">query latest by flightId (preferred when present)</text>

  <!-- Legend -->
  <line x1="20" y1="735" x2="60" y2="735" class="edge"/>
  <text x="68" y="739" class="note">write / trigger</text>
  <line x1="180" y1="735" x2="220" y2="735" class="edge read"/>
  <text x="228" y="739" class="note">read</text>
  <line x1="290" y1="735" x2="330" y2="735" class="edge fail"/>
  <text x="338" y="739" class="note">failure path</text>
  <text x="1555" y="739" text-anchor="end" class="note">Each Lambda has its own role scoped to the exact prefix, table or queue it uses.</text>
</svg>
